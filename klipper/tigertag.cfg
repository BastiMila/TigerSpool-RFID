# tigertag.cfg - TigerTag-Filamentdaten pro Werkzeug (OpenCreator / AFC 1.2.8)
#
# Lanes laut Moonraker: extruder0..extruder3 (T0..T3)
# Benoetigt: [save_variables] (ist in OpenCreator vorhanden) und AFC.
#
# Hinweis: Im gcode-Block keine Raute benutzen, Klipper schneidet dort ab.
# COLOR ohne Raute uebergeben, z. B. COLOR=FF8800.
#
# Beispiel:
#   TT_SET_LANE TOOL=1 MATERIAL=PETG SUBTYPE=Basic COLOR=FF8800 BRAND=eSUN TEMP=240 BEDTEMP=80 WEIGHT=850
#   TT_LOAD TOOL=1
#
# Version 5: neuer Parameter INITIAL (volle Menge der Spule), wird in
# tt_tN_total gespeichert, der Spool berechnet damit die Prozentanzeige.
# Version 4: die Meldung nach TT_SET_LANE zeigt alle empfangenen Parameter.
# Version 3: TEMP und BEDTEMP werden mit AFC_SET_SPOOL_TEMP in die Lane geschrieben
# (derselbe Befehl, den der SET-SPOOL-Knopf in Fluidd absetzt).
# Version 2: neuer Parameter SUBTYPE. BRAND und SUBTYPE werden bei jedem
# Aufruf gespeichert (auch leer), damit nichts vom vorigen Tag stehen bleibt.

[gcode_macro TT_SET_LANE]
description: Filamentdaten eines TigerTags auf ein Werkzeug (TOOL=0..3) anwenden
gcode:
    {% set tool = params.TOOL|default('')|string|trim %}
    {% if tool not in ['0', '1', '2', '3'] %}
        { action_raise_error("TT_SET_LANE: TOOL muss 0, 1, 2 oder 3 sein") }
    {% endif %}
    {% set lane = 'extruder' ~ tool %}

    {% set temp = params.TEMP|default(0)|float %}
    {% set max_temp = printer.configfile.settings['extruder'].max_temp|default(300)|float %}
    {% if temp < 0 or temp > max_temp %}
        { action_raise_error("TT_SET_LANE: TEMP ausserhalb des erlaubten Bereichs") }
    {% endif %}

    {% set bed = params.BEDTEMP|default(0)|float %}
    {% set bed_max = printer.configfile.settings.get('heater_bed', {}).max_temp|default(120)|float %}
    {% if bed < 0 or bed > bed_max %}
        { action_raise_error("TT_SET_LANE: BEDTEMP ausserhalb des erlaubten Bereichs") }
    {% endif %}

    {% set brand = params.BRAND|default('')|string|replace("'", "") %}
    {% set sub = params.SUBTYPE|default('')|string|replace("'", "") %}
    {% set tag = params.TAG|default('')|string|replace("'", "") %}

    {% if 'MATERIAL' in params %}
        SET_MATERIAL LANE={lane} MATERIAL={params.MATERIAL}
    {% endif %}
    {% if 'COLOR' in params %}
        SET_COLOR LANE={lane} COLOR={params.COLOR}
    {% endif %}
    {% if 'WEIGHT' in params %}
        SET_WEIGHT LANE={lane} WEIGHT={params.WEIGHT|float}
    {% endif %}
    {% if 'TEMP' in params or 'BEDTEMP' in params %}
        {% set lane_obj = printer['AFC_lane ' ~ lane]|default({}) %}
        {% set ext_t = params.TEMP|default(lane_obj.extruder_temp|default(0))|float %}
        {% set bed_t = params.BEDTEMP|default(lane_obj.bed_temp|default(0))|float %}
        AFC_SET_SPOOL_TEMP LANE={lane} BED_TEMP={bed_t|int} EXTRUDER_TEMP={ext_t|int}
    {% endif %}

    {% set total = params.INITIAL|default(0)|float %}
    SAVE_VARIABLE VARIABLE=tt_t{tool}_total VALUE={total|int}
    SAVE_VARIABLE VARIABLE=tt_t{tool}_temp VALUE={temp}
    SAVE_VARIABLE VARIABLE=tt_t{tool}_brand VALUE="'{brand}'"
    SAVE_VARIABLE VARIABLE=tt_t{tool}_sub VALUE="'{sub}'"
    SAVE_VARIABLE VARIABLE=tt_t{tool}_tag VALUE="'{tag}'"
    RESPOND MSG="TigerTag T{tool} erhalten: {rawparams|replace('"', '')}"
    {% if 'WEIGHT' not in params %}
        RESPOND MSG="TigerTag T{tool}: kein WEIGHT erhalten, Gewicht bleibt unveraendert"
    {% endif %}
    {% if 'TEMP' not in params and 'BEDTEMP' not in params %}
        RESPOND MSG="TigerTag T{tool}: keine Temperaturen erhalten, Lane-Temperaturen bleiben unveraendert"
    {% endif %}


[gcode_macro TT_LOAD]
description: Werkzeug TOOL=0..3 mit der aus dem Tag gespeicherten Temperatur laden
gcode:
    {% set tool = params.TOOL|default('')|string|trim %}
    {% if tool not in ['0', '1', '2', '3'] %}
        { action_raise_error("TT_LOAD: TOOL muss 0, 1, 2 oder 3 sein") }
    {% endif %}
    {% set sv = printer.save_variables.variables %}
    {% set temp = sv['tt_t' ~ tool ~ '_temp']|default(0)|float %}
    {% if temp > 0 %}
        C5_LOAD_FILAMENT TOOL={tool} TEMP={temp}
    {% else %}
        RESPOND MSG="TigerTag: keine Temperatur fuer T{tool} gespeichert, Standardwert wird benutzt"
        C5_LOAD_FILAMENT TOOL={tool}
    {% endif %}
